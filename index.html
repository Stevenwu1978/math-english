<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 英文數學</title>
<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#2b2b2b;--muted:#777;--pri:#ff8a3d;--pri2:#3d8bff;--ok:#2fb36b;--bad:#e5484d;--line:#eee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:18px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.06)}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--pri2);color:#fff;margin:4px}
button.ghost{background:#eef3ff;color:var(--pri2)}
button.choice{display:block;width:100%;text-align:left;background:#f4f6fb;color:var(--ink)}
button.ok{background:var(--ok)!important;color:#fff!important}
button.bad{background:var(--bad)!important;color:#fff!important}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{background:#eef3ff;color:var(--pri2)}
.tabs button.on{background:var(--pri2);color:#fff}
.flip{height:220px;perspective:800px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.flip .front{background:#fff3e8;font-size:32px;font-weight:700}
.flip .back{background:#e8f1ff;transform:rotateY(180deg);font-size:24px}
.small{font-size:15px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{background:#f4f6fb;color:var(--ink);min-height:56px}
.grid button.sel{outline:3px solid var(--pri2)}
.grid button.done{visibility:hidden}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.video{position:relative;padding-top:56.25%}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<header><h1 onclick="home()">🧮 Math 英文數學</h1><span id="who"></span></header>
<main id="app"></main>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const KEY="mathsite-v1";
let db; try{db=JSON.parse(localStorage.getItem(KEY))||{kids:[],cur:null,rec:{}}}catch(e){db={kids:[],cur:null,rec:{}}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,""));u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function rec(topic,kind,score,total){const r=db.rec[db.cur]=db.rec[db.cur]||{};const k=topic+"/"+kind;const p=r[k]||{best:0,tries:0};p.tries++;p.last=score+"/"+total;p.best=Math.max(p.best,Math.round(score/total*100));p.when=new Date().toLocaleString();r[k]=p;save()}
function pct(topic){const r=(db.rec[db.cur]||{});const ks=["words","match","calc","problems","quiz"];return Math.round(ks.reduce((s,k)=>s+((r[topic+"/"+k]||{}).best||0),0)/ks.length)}

// ---- 登入與權限 ----
db.pins=db.pins||{};db.locked=db.locked||{};
try{db.cur=sessionStorage.getItem(KEY+"-cur")||null}catch(e){db.cur=null}
let isParent=false;
if(db.cur&&!db.kids.includes(db.cur))db.cur=null;
const setCur=n=>{db.cur=n;try{n?sessionStorage.setItem(KEY+"-cur",n):sessionStorage.removeItem(KEY+"-cur")}catch(e){}};
async function hash(t){const d=new TextEncoder().encode("mathsite:"+t);const h=await crypto.subtle.digest("SHA-256",d);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const inputCss='font:inherit;padding:8px;border-radius:10px;border:1px solid #ccc';
function topicsFor(){return COURSE.topics.filter(t=>t.ready)}

function home(){
  $("#who").innerHTML=db.cur?`👤 ${esc(db.cur)} <button class="ghost" style="padding:4px 10px" onclick="logout()">登出</button>`:"";
  if(!db.parentHash) return setupParent();
  if(!db.cur) return pickKid();
  app.innerHTML=`<div class="card"><b>Hi, ${esc(db.cur)}!</b> 選一個單元開始 <button class="ghost" onclick="report()">成績紀錄</button></div>`+
  COURSE.topics.map(t=>{const open=t.ready&&!db.locked[t.id];return`<div class="card"><div style="font-size:20px;font-weight:700">${esc(t.en)}</div><div>${esc(t.zh)}</div>${open?`<div class="bar" style="margin:8px 0"><i style="width:${pct(t.id)}%"></i></div><div class="small">完成度 ${pct(t.id)}%${wcount(t.id)?`　📕 錯題 ${wcount(t.id)} 題`:""}</div><button onclick="topic('${t.id}')">開始 Start</button>`:`<div class="small">🔒 ${t.ready?"家長尚未開放":"製作中 Coming soon"}</div>`}</div>`}).join("");
}
function logout(){setCur(null);isParent=false;home()}
function setupParent(){
  $("#who").textContent="";
  app.innerHTML=`<div class="card"><h2>👋 第一次使用：設定家長密碼</h2><p>家長密碼用來新增孩子、設定孩子的 PIN、開放單元和重設成績。請記好，忘記的話只能清除瀏覽器資料重來。</p><p><input id="p1" type="password" placeholder="家長密碼（至少 4 碼）" style="${inputCss}"></p><p><input id="p2" type="password" placeholder="再輸入一次" style="${inputCss}"></p><p id="msg" class="small"></p><button onclick="saveParent()">設定</button></div>`;
}
async function saveParent(){
  const a=$("#p1").value,b=$("#p2").value;
  if(a.length<4)return $("#msg").textContent="至少 4 碼";
  if(a!==b)return $("#msg").textContent="兩次輸入不一樣";
  db.parentHash=await hash(a);save();isParent=true;parentPanel();
}
function pickKid(){
  $("#who").textContent="";
  app.innerHTML=`<div class="card"><h2>你是誰？ Who are you?</h2>${db.kids.length?db.kids.map(k=>`<button onclick="kidLogin('${esc(k)}')">${esc(k)}</button>`).join(""):"<p>還沒有孩子帳號，請家長先新增。</p>"}</div><div class="card"><button class="ghost" onclick="parentLogin()">🔑 家長管理</button></div>`;
}
function kidLogin(n){
  if(!db.pins[n]){setCur(n);return home()}
  app.innerHTML=`<div class="card"><h2>${esc(n)}，請輸入 PIN</h2><input id="pin" type="password" inputmode="numeric" autocomplete="off" style="${inputCss};font-size:24px;width:160px"> <button id="go">登入</button><p id="msg" class="small"></p><button class="ghost" onclick="pickKid()">返回</button></div>`;
  const go=async()=>{if(await hash($("#pin").value)===db.pins[n]){setCur(n);home()}else{$("#msg").textContent="PIN 不對，再試一次";$("#pin").select()}};
  $("#go").onclick=go;$("#pin").onkeydown=e=>{if(e.key==="Enter")go()};$("#pin").focus();
}
function parentLogin(){
  if(isParent)return parentPanel();
  app.innerHTML=`<div class="card"><h2>🔑 家長登入</h2><input id="pw" type="password" style="${inputCss}"> <button id="go">登入</button><p id="msg" class="small"></p><button class="ghost" onclick="home()">返回</button></div>`;
  const go=async()=>{if(await hash($("#pw").value)===db.parentHash){isParent=true;parentPanel()}else{$("#msg").textContent="密碼不對"}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};$("#pw").focus();
}
function parentPanel(){
  if(!isParent)return parentLogin();
  setCur(null);$("#who").innerHTML=`🔑 家長 <button class="ghost" style="padding:4px 10px" onclick="logout()">登出</button>`;
  const kids=db.kids.map((k,i)=>`<tr><td><b>${esc(k)}</b></td><td>${db.pins[k]?"已設定":"未設定"}</td><td><button class="ghost" onclick="setPin(${i})">設定 PIN</button><button class="ghost" onclick="report(db.kids[${i}])">成績</button><button class="ghost" onclick="resetKid(${i})">重設紀錄</button><button class="bad" onclick="delKid(${i})">刪除</button></td></tr>`).join("");
  const tops=topicsFor().map(t=>`<label style="display:block;margin:6px 0"><input type="checkbox" ${db.locked[t.id]?"":"checked"} onchange="db.locked['${t.id}']=!this.checked;save()"> ${esc(t.zh)}</label>`).join("");
  app.innerHTML=`<div class="card"><h2>👨‍👩‍👧 孩子帳號</h2><table><tr><th>名字</th><th>PIN</th><th></th></tr>${kids||"<tr><td colspan=3>還沒有孩子帳號</td></tr>"}</table><p><input id="nk" placeholder="孩子名字" style="${inputCss}"> <input id="npin" type="password" inputmode="numeric" placeholder="PIN（可留空）" style="${inputCss};width:140px"> <button onclick="addKid()">新增</button></p><p id="msg" class="small"></p></div>
  <div class="card"><h2>🔓 開放給孩子的單元</h2>${tops}</div>
  <div class="card"><h2>🔑 家長密碼</h2><input id="np" type="password" placeholder="新密碼（至少 4 碼）" style="${inputCss}"> <button onclick="changeParent()">修改</button><p id="pmsg" class="small"></p></div>
  <div class="card"><button onclick="logout()">完成，回到登入畫面</button></div>`;
}
async function addKid(){const n=$("#nk").value.trim(),pin=$("#npin").value.trim();if(!n)return;if(db.kids.includes(n))return $("#msg").textContent="這個名字已經有了";db.kids.push(n);if(pin)db.pins[n]=await hash(pin);save();parentPanel()}
async function setPin(i){const k=db.kids[i];
  app.innerHTML=`<div class="card"><h2>設定 ${esc(k)} 的 PIN</h2><input id="pin" type="password" inputmode="numeric" placeholder="留空表示不需要 PIN" style="${inputCss}"> <button id="ok">儲存</button> <button class="ghost" onclick="parentPanel()">取消</button></div>`;
  $("#ok").onclick=async()=>{const v=$("#pin").value.trim();if(v)db.pins[k]=await hash(v);else delete db.pins[k];save();parentPanel()};$("#pin").focus();
}
function confirmBox(text,yes){app.innerHTML=`<div class="card"><h2>${text}</h2><button class="bad" id="y">確定</button> <button class="ghost" onclick="parentPanel()">取消</button></div>`;$("#y").onclick=()=>{yes();save();parentPanel()}}
function resetKid(i){const k=db.kids[i];confirmBox(`清除 ${esc(k)} 的成績和錯題本？`,()=>{delete db.rec[k];if(db.wrong)delete db.wrong[k]})}
function delKid(i){const k=db.kids[i];confirmBox(`刪除 ${esc(k)} 的帳號和所有紀錄？`,()=>{db.kids.splice(i,1);delete db.rec[k];delete db.pins[k];if(db.wrong)delete db.wrong[k]})}
async function changeParent(){const v=$("#np").value;if(v.length<4)return $("#pmsg").textContent="至少 4 碼";db.parentHash=await hash(v);save();$("#pmsg").textContent="已修改"}

function report(kid){
  const who=kid||db.cur;const r=db.rec[who]||{};const names={calc:"計算練習",words:"單字卡",match:"配對遊戲",problems:"應用題",quiz:"小測驗"};
  const rows=Object.entries(r).map(([k,v])=>{const[t,kind]=k.split("/");const tp=COURSE.topics.find(x=>x.id==t);return`<tr><td>${esc(tp?tp.zh:t)}</td><td>${names[kind]}</td><td>${v.best}%</td><td>${v.last}</td><td>${v.tries}</td><td class="small">${esc(v.when)}</td></tr>`}).join("");
  app.innerHTML=`<div class="card"><h2>${esc(who)} 的成績紀錄</h2><table><tr><th>單元</th><th>項目</th><th>最佳</th><th>上次</th><th>次數</th><th>時間</th></tr>${rows||"<tr><td colspan=6>還沒有紀錄</td></tr>"}</table><h3>📕 錯題本</h3><p>${COURSE.topics.filter(t=>t.ready).map(t=>`${esc(t.zh)}：${wcount(t.id,who)} 題`).join("<br>")}</p><button onclick="${kid?"parentPanel()":"home()"}">${kid?"回家長管理":"回首頁"}</button></div>`;
}

let T;
function topic(id,tab="learn"){
  T=COURSE.topics.find(t=>t.id==id);if(!db.cur||db.locked[id])return home();
  const tabs=[["learn","📺 影片與觀念"],["words","🃏 單字卡"],["match","🧩 配對遊戲"],["calc","🔢 計算練習"],["problems","📝 應用題"],["quiz","✅ 小測驗"],["review","📕 錯題本"+(wcount(id)?`（${wcount(id)}）`:"")]];
  app.innerHTML=`<div class="card"><div style="font-weight:700">${esc(T.en)}　${esc(T.zh)}</div><div class="tabs" style="margin-top:8px">${tabs.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="topic('${id}','${k}')">${l}</button>`).join("")}</div></div><div id="pane"></div>`;
  ({learn,words,match,calc,problems,quiz,review})[tab]();
}
function learn(){
  const vids=(T.videos||[]).map(v=>`<div class="card"><h3>📺 ${esc(v.title)}</h3><div class="small">Lesson ${esc(v.lesson)} · ${esc(v.by)}</div><div class="video" style="margin-top:8px"><iframe src="https://www.youtube-nocookie.com/embed/${esc(v.id)}?rel=0" allowfullscreen loading="lazy"></iframe></div></div>`).join("");
  const les=(T.lessons||[]).map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join("");
  $("#pane").innerHTML=`${les?`<div class="card"><h3>📚 課程 Lessons</h3><table>${les}</table></div>`:""}<div class="card"><h3>💡 重要觀念 Big Ideas</h3>${T.concept.map(c=>`<p><b>${esc(c.en)}</b> <button class="ghost" onclick="say(this.dataset.t)" data-t="${esc(c.en)}">🔊</button><br>${esc(c.zh)}</p>`).join("")}</div>${vids}`;
}
function words(){
  let i=0,known=0;const list=shuffle(T.words);
  const draw=()=>{
    if(i>=list.length){rec(T.id,"words",known,list.length);$("#pane").innerHTML=`<div class="card"><h3>完成！你認得 ${known} / ${list.length} 個單字</h3><button onclick="words()">再練一次</button></div>`;return}
    const w=list[i];
    $("#pane").innerHTML=`<div class="card"><div class="small">${i+1} / ${list.length}　點卡片翻面</div><div class="flip" id="fc"><div class="in"><div class="side front">${esc(w.en)}</div><div class="side back"><div>${esc(w.zh)}</div><div class="small" style="margin-top:12px">${esc(w.ex)}</div></div></div></div><p style="text-align:center"><button class="ghost" id="sp">🔊 發音</button><button class="bad" id="no">還不會</button><button class="ok" id="yes">我會了</button></p></div>`;
    $("#fc").onclick=()=>$("#fc").classList.toggle("f");
    $("#sp").onclick=()=>say(w.en);
    $("#yes").onclick=()=>{known++;i++;draw()};$("#no").onclick=()=>{i++;draw()};
    say(w.en);
  };draw();
}
function match(){
  const pick=shuffle(T.words).slice(0,6);let sel=null,left=pick.length,miss=0;
  const tiles=shuffle([...pick.map((w,k)=>({k,t:w.en})),...pick.map((w,k)=>({k,t:w.zh}))]);
  $("#pane").innerHTML=`<div class="card"><div class="small">把英文和中文配成一對</div><div class="grid">${tiles.map((x,n)=>`<button data-k="${x.k}" data-n="${n}">${esc(x.t)}</button>`).join("")}</div></div>`;
  document.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{
    if(/[a-z]/i.test(b.textContent)&&!/[一-鿿]/.test(b.textContent))say(b.textContent);
    if(!sel){sel=b;b.classList.add("sel");return}
    if(sel===b){b.classList.remove("sel");sel=null;return}
    if(sel.dataset.k===b.dataset.k){sel.classList.add("done");b.classList.add("done");left--;
      if(!left){const sc=Math.max(0,pick.length-miss);rec(T.id,"match",sc,pick.length);$("#pane").innerHTML=`<div class="card"><h3>🎉 全部配對成功！錯了 ${miss} 次</h3><button onclick="match()">再玩一次</button></div>`}}
    else{miss++;b.classList.add("bad");const s=sel;setTimeout(()=>{b.classList.remove("bad");s.classList.remove("sel")},500)}
    sel.classList.remove("sel");sel=null;
  });
}
function problems(){
  let p=0,s=0,right=0,total=0;
  const draw=()=>{
    if(p>=T.problems.length){rec(T.id,"problems",right,total);$("#pane").innerHTML=`<div class="card"><h3>完成！一次答對 ${right} / ${total} 個步驟</h3><button onclick="problems()">再做一次</button></div>`;return}
    const pr=T.problems[p],st=pr.steps[s];let tried=false;
    $("#pane").innerHTML=`<div class="card"><div class="small">應用題 ${p+1} / ${T.problems.length}　步驟 ${s+1} / ${pr.steps.length}</div><p><b>${esc(pr.en)}</b> <button class="ghost" id="sp">🔊</button><br>${esc(pr.zh)}</p><hr><p>${esc(st.q)}</p>${st.choices.map(c=>`<button class="choice">${esc(c)}</button>`).join("")}</div>`;
    $("#sp").onclick=()=>say(pr.en);
    document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
      if(b.textContent===st.answer){if(!tried)right++;total++;b.classList.add("ok");setTimeout(()=>{s++;if(s>=pr.steps.length){s=0;p++}draw()},600)}
      else{tried=true;b.classList.add("bad");b.disabled=true}
    });
  };draw();
}
// ---- 錯題本 ----
function wbook(){db.wrong=db.wrong||{};const w=db.wrong[db.cur]=db.wrong[db.cur]||{};return w[T.id]=w[T.id]||{}}
function wcount(tid,who){return Object.keys(((db.wrong||{})[who||db.cur]||{})[tid]||{}).length}
function markWrong(kind,q){const w=wbook();const k=kind+"|"+q.q;w[k]=(w[k]||0)+1;save()}
function markRight(kind,q){const w=wbook();delete w[kind+"|"+q.q];save()}
function wrongItems(){const w=wbook();return Object.keys(w).map(k=>{const[kind,...r]=k.split("|");const txt=r.join("|");const q=(kind=="quiz"?T.quiz:T.calc).find(x=>x.q===txt);return q?{kind,q,n:w[k]}:null}).filter(Boolean)}
function review(){
  const items=wrongItems();
  if(!items.length){$("#pane").innerHTML=`<div class="card"><h3>📕 錯題本是空的 🎉</h3><p>測驗或計算練習答錯的題目會自動放進這裡，答對就會移出。</p></div>`;return}
  $("#pane").innerHTML=`<div class="card"><h3>📕 錯題本（${items.length} 題）</h3><table><tr><th>題目</th><th>類型</th><th>錯過次數</th></tr>${items.map(x=>`<tr><td>${esc(x.q.q)}</td><td>${x.kind=="quiz"?"測驗":"計算"}</td><td>${x.n}</td></tr>`).join("")}</table><p><button onclick="runItems(shuffle(wrongItems()),'review')">開始練習錯題</button></p><p class="small">答對的題目會從錯題本移除，答錯的會留著下次再練。</p></div>`;
}
// 通用出題：items = [{kind:"quiz"|"calc", q}]，mode = "quiz" | "calc" | "review"
function runItems(items,mode){
  let i=0,sc=0;const wrong=[];
  const norm=x=>String(x).replace(/[,\s$]/g,"");
  const finish=()=>{
    if(mode!=="review")rec(T.id,mode,sc,items.length);
    const left=wcount(T.id);
    const title=mode=="review"?`錯題練習完成！答對 ${sc} / ${items.length} 題`:mode=="quiz"?`得分 ${Math.round(sc/items.length*100)} 分（${sc} / ${items.length}）`:`計算練習完成！答對 ${sc} / ${items.length} 題`;
    const list=wrong.length?`<h4>這次答錯的題目</h4><table><tr><th>題目</th><th>正確答案</th></tr>${wrong.map(x=>`<tr><td>${esc(x.q.q)}</td><td><b>${esc(x.kind=="quiz"?x.q.answer:x.q.a)}</b></td></tr>`).join("")}</table>`:`<p>全部答對，太棒了！🎉</p>`;
    const again=mode=="review"?"review()":mode+"()";
    $("#pane").innerHTML=`<div class="card"><h3>${title}</h3>${list}<p>${left?`<button onclick="runItems(shuffle(wrongItems()),'review')">📕 練習錯題（${left} 題）</button>`:""}<button class="ghost" onclick="${again}">${mode=="review"?"回錯題本":"再做一次"}</button></p></div>`;
  };
  const next=()=>{i++;draw()};
  const draw=()=>{
    if(i>=items.length)return finish();
    const {kind,q}=items[i];
    const head=`<div class="small">${mode=="review"?"📕 錯題 ":""}第 ${i+1} / ${items.length} 題</div>`;
    if(kind=="quiz"){
      $("#pane").innerHTML=`<div class="card">${head}<p><b>${esc(q.q)}</b></p>${shuffle(q.choices).map(c=>`<button class="choice">${esc(c)}</button>`).join("")}</div>`;
      document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
        document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.textContent===q.answer)x.classList.add("ok")});
        if(b.textContent===q.answer){sc++;if(mode=="review")markRight(kind,q)}else{b.classList.add("bad");wrong.push(items[i]);markWrong(kind,q)}
        setTimeout(next,b.textContent===q.answer?900:1600);
      });
    }else{
      let tried=false;
      $("#pane").innerHTML=`<div class="card">${head}<div class="small">直接輸入答案（逗號可加可不加）</div><p style="font-size:24px"><b>${esc(q.q)}</b></p>${q.zh?`<p class="small">${esc(q.zh)}</p>`:""}<input id="ans" inputmode="numeric" autocomplete="off" style="font:inherit;font-size:24px;padding:8px;border-radius:10px;border:2px solid #ccc;width:200px"> <button id="ck">確定 Check</button><p id="fb"></p></div>`;
      const inp=$("#ans");inp.focus();
      const check=()=>{
        if(!inp.value.trim()||$("#ck").disabled)return;
        if(norm(inp.value)===norm(q.a)){if(!tried){sc++;if(mode=="review")markRight(kind,q)}$("#fb").innerHTML=`<b style="color:var(--ok)">✔ 答對了！ Correct!</b>`;$("#ck").disabled=true;setTimeout(next,900)}
        else if(!tried){tried=true;wrong.push(items[i]);markWrong(kind,q);$("#fb").innerHTML=`<b style="color:var(--bad)">再想一想 Try again</b>${q.hint?`<br><span class="small">提示：${esc(q.hint)}</span>`:""}`;inp.select()}
        else{$("#fb").innerHTML=`<b style="color:var(--bad)">答案是 ${esc(q.a)}</b> <button id="nx">下一題</button>`;$("#nx").onclick=next;$("#ck").disabled=true}
      };
      $("#ck").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};
    }
  };draw();
}
function quiz(){runItems(shuffle(T.quiz).map(q=>({kind:"quiz",q})),"quiz")}
function calc(){runItems(T.calc.map(q=>({kind:"calc",q})),"calc")}

home();
</script>
